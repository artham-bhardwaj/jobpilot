# Alembic CLI configuration. The database URL comes from JobPilot settings
# (JOBPILOT_DATABASE_URL / JOBPILOT_DATA_DIR); prefer `jobpilot db upgrade`.
[alembic]
script_location = src/jobpilot/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
