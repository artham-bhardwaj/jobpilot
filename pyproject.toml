[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Local-first job search and application management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = [
    "web/templates/*.html",
    "web/templates/**/*.html",
    "web/static/*",
    "migrations/*",
    "migrations/versions/*.py",
    "data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pypdf.*",
    # Third-party: Starlette's TestClient warns about its own httpx backend; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "error::ResourceWarning",
]
